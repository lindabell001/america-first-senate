<head>
  <meta charset="UTF-8">

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
      color: #222;
    }
    header {
      background-color: #002868;
      color: white;
      padding: 15px 25px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 6px solid #BF0A30;
    }
    header img {
      height: 70px;
      width: auto;
    }
    header .title-area {
      text-align: center;
      flex-grow: 1;
      padding: 0 20px;
    }
    header h1 {
      margin: 0;
      font-size: 1.9rem;
      letter-spacing: 0.5px;
    }
    header p {
      margin: 4px 0 0 0;
      font-size: 0.95rem;
      opacity: 0.9;
    }
    nav {
      background-color: #BF0A30;
      text-align: center;
      padding: 14px;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 14px;
      font-weight: bold;
      font-size: 0.95rem;
    }
    nav a:hover {
      text-decoration: underline;
    }
    main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
    }
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px;
      margin-top: 30px;
    }
    .card {
      background: white;
      border: 2px solid #002868;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
    .card .state {
      font-size: 0.9rem;
      font-weight: bold;
      color: #BF0A30;
      margin-bottom: 6px;
    }
    .card .name {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .card .status {
      font-size: 0.95rem;
      color: #444;
      margin-bottom: 18px;
    }
    .card-buttons a {
      display: inline-block;
      margin-right: 8px;
      margin-bottom: 6px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: bold;
      text-decoration: none;
      border-radius: 5px;
      color: white;
    }
    .card-buttons .share {
      background-color: #1DA1F2;
    }
    .card-buttons .chat {
      background-color: #BF0A30;
    }
    footer {
      text-align: center;
      padding: 30px;
      background-color: #002868;
      color: white;
      margin-top: 50px;
      border-top: 6px solid #BF0A30;
    }
  </style>
</head>
<body>

  <header>
    <img src="newlogo.jpg" alt="America First Citizens Network">
    
    <div class="title-area">
      <h1>MAKE SENATE AMERICA FIRST</h1>
      <p>They Also Ran</p>
    </div>

    <img src="make-senate.jpg" alt="MAKE SENATE AMERICA FIRST">
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="elect.html">Elect America First</a>
    <a href="track.html">Track Republicans</a>
    <a href="defeat.html">Defeat Democrats</a>
    <a href="also-ran.html">They Also Ran</a>
  </nav>

  <main>
    <h2>They Also Ran</h2>
    <div id="also-ran-list" class="cards">
      <p>Loading data...</p>
    </div>
  </main>

  <footer>
    MAKE SENATE AMERICA FIRST &copy; 2026<br>
    A Project of America First Citizens Network
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://pnxfelmnyqltuzgdraqh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_3vfHMQiFfVEFbBQo_RqXPg_O9b3yv27";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadAlsoRan() {
      const { data, error } = await supabaseClient
        .from('people')
        .select('*')
        .eq('status', 'Also Ran')
        .order('state');

      const list = document.getElementById('also-ran-list');

      if (error) {
        list.innerHTML = "<p>Error loading data.</p>";
        console.error(error);
        return;
      }

      if (!data || data.length === 0) {
        list.innerHTML = "<p>No 'Also Ran' records found yet.</p>";
        return;
      }

      let html = "";
      data.forEach(person => {
        html += `
          <div class="card">
            <div class="state">${person.state || ''}</div>
            <div class="name">${person.full_name || ''}</div>
            <div class="status">Status: ${person.status || ''}</div>
            <div class="card-buttons">
              <a class="share" href="https://twitter.com/intent/tweet?text=${encodeURIComponent(person.full_name + ' - MAKE SENATE AMERICA FIRST')}&url=https://peppy-ganache-7a60b6.netlify.app/also-ran.html" target="_blank">Share on X</a>
              <a class="chat" href="https://americafirstcitizensnetwork.org" target="_blank">Discuss</a>
            </div>
          </div>
        `;
      });
      list.innerHTML = html;
    }

    loadAlsoRan();
  </script>

</body>
</html>
