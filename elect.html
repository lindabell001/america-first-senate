<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elect America First | MAKE SENATE AMERICA FIRST</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f8f9fa;
      color: #222;
    }
    header {
      background-color: #002868;
      color: white;
      padding: 20px;
      display: flex;
      align-items: center;
      gap: 20px;
      border-bottom: 6px solid #BF0A30;
    }
    header img {
      height: 80px;
      width: auto;
    }
    header .title-area {
      flex-grow: 1;
      text-align: center;
    }
    header h1 {
      margin: 0;
      font-size: 2.2rem;
    }
    header p {
      margin: 5px 0 0 0;
      font-size: 1.1rem;
    }
    nav {
      background-color: #BF0A30;
      text-align: center;
      padding: 15px;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-weight: bold;
    }
    nav a:hover {
      text-decoration: underline;
    }
    main {
      max-width: 1000px;
      margin: 40px auto;
      padding: 0 20px;
    }
    footer {
      text-align: center;
      padding: 30px;
      background-color: #002868;
      color: white;
      margin-top: 50px;
      border-top: 6px solid #BF0A30;
    }
    ul {
      line-height: 1.8;
    }
  </style>
</head>
<body>

  <header>
    <img src="newlogo.jpg" alt="America First Citizens Network">
    <div class="title-area">
      <h1>Elect America First</h1>
      <p>Candidates and nominees who put America First</p>
    </div>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="elect.html">Elect America First</a>
    <a href="track.html">Track Republicans</a>
    <a href="defeat.html">Defeat Democrats</a>
    <a href="also-ran.html">They Also Ran</a>
  </nav>

  <main>
    <h2>America First Candidates & Nominees</h2>
    <div id="candidates-list">
      <p>Loading candidates...</p>
    </div>
  </main>

  <footer>
    MAKE SENATE AMERICA FIRST &copy; 2026
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = "https://pnxfelmnyqltuzgdraqh.supabase.co";
    const SUPABASE_ANON_KEY = "PASTE_YOUR_PUBLISHABLE_KEY_HERE";

    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function loadCandidates() {
      const { data, error } = await supabaseClient
        .from('people')
        .select('*')
        .in('status', ['Candidate', 'Nominee'])
        .order('state');

      const list = document.getElementById('candidates-list');

      if (error) {
        list.innerHTML = "<p>Error loading data. Please check the key.</p>";
        console.error(error);
        return;
      }

      if (!data || data.length === 0) {
        list.innerHTML = "<p>No candidates or nominees found yet.</p>";
        return;
      }

      let html = "<ul>";
      data.forEach(person => {
        html += `<li><strong>${person.full_name}</strong> (${person.state}) – ${person.status}</li>`;
      });
      html += "</ul>";
      list.innerHTML = html;
    }

    loadCandidates();
  </script>

</body>
</html>
